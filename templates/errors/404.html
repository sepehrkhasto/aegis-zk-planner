{% extends "base.html" %}

{% block body %}
<main class="auth-wrap">
  <div class="auth-card auth-card--center">
    <div class="brand"><span class="brand__mark" aria-hidden="true"></span><span class="brand__name">Aegis Planner</span></div>
    <p class="err-code" data-l="e404Code">۴۰۴</p>
    <h1 class="auth-title" data-l="e404Title">صفحه پیدا نشد</h1>
    <p class="auth-sub" data-l="e404Sub">صفحه‌ای که دنبالش بودی وجود ندارد.</p>
    <a href="/" class="btn btn--ghost" data-l="backHome">بازگشت به خانه</a>
  </div>
</main>
{% endblock %}
